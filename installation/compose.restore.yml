# Every restore begins without public listeners or outbound worker processing.
# mi_install refuses normal start/restart while this overlay is active.
services:
  app:
    ports: !reset []
  worker:
    profiles: [restore-worker-not-activated]
  gateway:
    profiles: [restore-gateway-not-activated]
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    ports: !reset []
    networks: !override [appnet]
networks:
  appnet:
    internal: true
