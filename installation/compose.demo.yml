services:
  app:
    environment:
      MI_INSTALL_PROFILE: demo
      MI_WEB_PORT: ${MI_WEB_PORT}
      MI_LOCAL_HTTP: 'true'
      DECIDIM_FORCE_SSL: 'false'
      SMTP_ADDRESS: mail
      SMTP_PORT: '1025'
      SMTP_AUTHENTICATION: none
      SMTP_STARTTLS_AUTO: 'false'
      SMTP_DOMAIN: community.example.invalid
      DECIDIM_MAILER_SENDER: 'Fondacija Primjer <noreply@community.example.invalid>'
      DECIDIM_APPLICATION_NAME: 'MI preduzimamo — Zajednica Primjer'
      REPORT_MAIL_TRANSPORT: relay
    volumes:
      - ./.mi-install/private:/app/installation-private
  worker:
    environment:
      MI_INSTALL_PROFILE: demo
      MI_WEB_PORT: ${MI_WEB_PORT}
      MI_LOCAL_HTTP: 'true'
      DECIDIM_FORCE_SSL: 'false'
      SMTP_ADDRESS: mail
      SMTP_PORT: '1025'
      SMTP_AUTHENTICATION: none
      SMTP_STARTTLS_AUTO: 'false'
      SMTP_DOMAIN: community.example.invalid
      DECIDIM_MAILER_SENDER: 'Fondacija Primjer <noreply@community.example.invalid>'
      REPORT_MAIL_TRANSPORT: relay
    volumes:
      - ./.mi-install/private:/app/installation-private
  mail:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
    volumes: [mail:/data]
    networks: [appnet]
  gateway:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MI_WEB_PORT}:8080'
      - '127.0.0.1:${MI_MAIL_PORT}:8025'
    volumes: ['./installation/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [edge, appnet]
    depends_on:
      app: {condition: service_healthy}
      mail: {condition: service_started}
volumes:
  mail:
networks:
  edge:
  appnet:
    internal: true
