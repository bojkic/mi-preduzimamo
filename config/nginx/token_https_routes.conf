# Token credentials are embedded in these paths or their query strings. Route
# them normally but do not write the raw request URI to nginx access.log. Rails
# adds no-store, strict-origin, noindex headers for every response.
#
# The $ anchor keeps each entry to the page itself, so the POST actions below
# /registracija/potvrda still log normally. DELETE /registracija/potvrda —
# "change the number" — is the exception and shares this location by design: it
# is the same URL as the pending page, and nginx matches on the path alone.
location ~ ^/(?:v/[^/]+|biceriseno/v/[^/]+|biceriseno/prijave/[^/]+/status/[^/]+|registracija/drustvene-mreze|registracija/potvrda|biceriseno/registracija/potvrda|biceriseno/potvrdi-email/[^/]+)$ {
    access_log off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 60s;
    proxy_pass http://decidim_puma;
}
