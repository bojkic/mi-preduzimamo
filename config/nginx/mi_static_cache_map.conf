# Install in /etc/nginx/conf.d/mi-static-cache.conf (http context).
# Only the MI public static location consumes this variable.
# Numeric mtime query versions change whenever the source asset changes.
map $arg_v $mi_static_cache_control {
    default "public, max-age=604800";
    "~^[0-9]{10}$" "public, max-age=31536000, immutable";
}
