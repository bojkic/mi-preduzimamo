# Install in /etc/nginx/snippets/mi-security-headers.conf.
# Include at HTTPS server level and in locations defining their own add_header.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $mi_frame_policy always;
add_header Referrer-Policy $mi_referrer_policy always;
