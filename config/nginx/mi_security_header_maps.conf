# Install in /etc/nginx/conf.d/mi-security-header-maps.conf (http context).
# Preserve stricter per-route Rails policy; static responses use the fallback.
map $upstream_http_referrer_policy $mi_referrer_policy {
    "" "strict-origin-when-cross-origin";
    default $upstream_http_referrer_policy;
}
map $upstream_http_x_frame_options $mi_frame_policy {
    "" "SAMEORIGIN";
    default $upstream_http_x_frame_options;
}
