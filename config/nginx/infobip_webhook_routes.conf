# Infobip inbound webhooks: Viber Bot (dormant), Viber Business Messages,
# WhatsApp, Messenger, Instagram.
#
# Two things nginx does here that the application cannot.
#
# 1. client_max_body_size. Rails parses the request body BEFORE the controller
#    runs — before the shared-secret check and before the app's own 16 MB bound
#    — so at the server-wide 100M an unauthenticated POST could have 100 MB of
#    JSON parsed into Ruby objects. Rejecting oversized bodies here keeps that
#    out of the app entirely. 16m matches the app's bound
#    (DecidimApp::BoundedWebhookBody).
#
# 2. Source allowlist. Infobip signs nothing: the only credential is a static
#    X-Webhook-Secret header, and on Viber BM the sender IS the identity — a
#    secret holder could post `from: <any citizen's phone>` and file reports as
#    them. The header stays the primary control; this is defence in depth
#    (2026-09-07 messaging review, lane 3 F-2/F-3).
#
# Ranges are Infobip's published safelist for traffic they send TO customers
# (incoming messages, delivery/seen/deleted reports):
# https://www.infobip.com/docs/essentials/api-essentials/ip-address-safelist
# Captured 2026-09-07. Real inbound traffic to this host has been seen from
# 193.105.74.58, which is inside 193.105.74.0/24 on that list.
#
# NOTE: this server's own public address (178.104.223.92) is deliberately NOT
# allowlisted, so a curl from the box itself gets 403. That is the rule
# working, not a fault — do not "fix" it by adding the server. To test the
# application layer instead, POST to the Puma socket directly, or read
# access.log for a real provider request.
#
# ⚠️ If Infobip adds an egress range and this file is not updated, their POSTs
# get 403 and citizens' WhatsApp/Messenger messages are silently dropped. The
# symptom is 403s on these paths in access.log with no matching receipt in
# decidim_bih_viber_inbound_deliveries. Re-check the page above before blaming
# the app.
location ~ ^/biceriseno/(?:viber|viber-bm|whatsapp|messenger|instagram)/webhook$ {
    client_max_body_size 16m;

    allow 193.105.74.0/24;
    allow 62.140.31.0/24;
    allow 83.166.64.0/19;
    allow 202.22.160.0/20;
    allow 81.23.248.0/21;
    allow 185.255.8.0/22;
    allow 208.93.48.0/22;
    allow 89.164.98.0/24;
    allow 149.5.186.0/24;
    allow 171.244.0.32/27;
    allow 203.223.163.32/28;
    allow 203.223.170.88/29;
    allow 119.30.69.0/28;
    allow 103.23.95.200/29;
    allow 66.203.199.128/27;
    allow 13.87.78.119/32;
    allow 20.216.25.182/32;
    allow 20.173.68.171/32;
    allow 172.195.40.23/32;
    allow 34.166.0.168/32;
    allow 34.166.49.86/32;
    allow 20.233.44.67/32;
    allow 20.108.54.3/32;
    deny all;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 60s;
    proxy_pass http://decidim_puma;
}
