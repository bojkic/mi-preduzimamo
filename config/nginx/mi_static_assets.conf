# Content-fingerprinted MI files change URL with their bytes.
location ~ "^/mi/[a-z0-9_-]+-[a-f0-9]{12}\.(svg|webp|png|jpg|css|js)$" {
    gzip_static on;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/mi-security-headers.conf;
    try_files $uri @puma;
}

# Include in the MI HTTPS server, before other static regex locations.
# Google font filenames identify fixed font/subset versions.
location ~ ^/mi/fonts/[A-Za-z0-9_-]+\.woff2$ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/mi-security-headers.conf;
    try_files $uri @puma;
}

# Year-long caching only for explicit mtime-versioned URLs. Mutable images
# and unversioned URLs retain the existing seven-day lifetime.
location ~ ^/(mi|leaflet)/ {
    gzip_static on;
    expires off;
    add_header Cache-Control $mi_static_cache_control;
    include /etc/nginx/snippets/mi-security-headers.conf;
    try_files $uri @puma;
}
