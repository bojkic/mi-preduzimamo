---
# Admin content editor pilot (Milica FAQ overrides + foundation call status).
# `sr` is the maintained source; `sr-Cyrl` is GENERATED from it with
# Decidim::Bih::Transliterator (see the parity test in
# test/integration/decidim_app/admin/city_service_entries_controller_test.rb) —
# edit `sr`, then regenerate; never hand-edit the Cyrillic block.
sr:
  activerecord:
    attributes:
      decidim_app/bijeljina/city_service_entry:
        key: Ključ
        title: Naslov
        body: Tekst odgovora
        source_url: Izvor (link)
        source_checked_on: Datum provjere izvora
        state: Stanje
      decidim_app/bijeljina/foundation_status_override:
        current_open_status: Status poziva
        reviewed_on: Datum pregleda
        review_expires_on: Pregled važi do
        state: Stanje
    errors:
      models:
        decidim_app/bijeljina/city_service_entry:
          attributes:
            key:
              not_shipped: nije jedan od isporučenih FAQ odgovora
            source_url:
              not_public_http: mora biti javni http(s) link bez korisničkog imena i lozinke
            source_checked_on:
              in_future: ne može biti u budućnosti
        decidim_app/bijeljina/foundation_status_override:
          attributes:
            reviewed_on:
              in_future: ne može biti u budućnosti
            review_expires_on:
              not_after_reviewed_on: mora biti poslije datuma pregleda
  decidim_app:
    admin:
      city_service_entries:
        menu: FAQ odgovori (Milica)
        navigation_description: Ispravi tekst gradskog FAQ odgovora bez novog izdanja; građani ga vide tek nakon odobrenja.
        states:
          shipped: Isporučeno (bez izmjene)
          draft: Nacrt — građani ga ne vide
          approved: Odobreno — Milica koristi ovaj tekst
          rolled_back: Povučeno — koristi se isporučeni tekst
          approval_stale: Izmijenjeno nakon odobrenja — koristi se isporučeni tekst
        index:
          title: FAQ odgovori gradskih servisa
          intro: Svaki red je jedan isporučeni odgovor. Uredi ga u nacrt, pregledaj kako ga Milica izgovara, pa odobri. Građani nikada ne vide nacrt.
          columns:
            key: Ključ
            title: Naslov
            state: Stanje
            source_checked_on: Izvor provjeren
            approved_at: Odobreno
            actions: Radnje
          actions:
            edit: Uredi
            preview: Pregled odgovora
            approve: Odobri
            rollback: Povuci
            rollback_confirm: Povući odobreni tekst? Milica se odmah vraća na isporučeni odgovor.
            foundation_status: Status poziva fondacije
        edit:
          title: "Uredi odgovor: %{title}"
          intro: Izmjene se čuvaju kao nacrt. Milica koristi novi tekst tek kad ga odobriš; do tada važi isporučeni odgovor.
          shipped_heading: Isporučeni tekst
          fields:
            title: Naslov
            body: Tekst odgovora
            source_url: Izvor (link)
            source_checked_on: Datum provjere izvora
          help:
            source_host: Link ka službenom izvoru. Ako domen nije u pregledanom registru izvora, Milica navodi samo tekst odgovora, bez posebnog linka na izvor.
            approval: Odobrenje bilježi otisak sadržaja (SHA-256 naslova, teksta i linka), vrijeme i operatera. Svaka kasnija izmjena vraća odgovor u nacrt.
          source_host_warning: "Domen %{host} nije u pregledanom registru izvora — link se neće posebno navesti uz odgovor."
          actions:
            save: Sačuvaj nacrt
            preview: Pregled odgovora
            approve: Odobri ovaj tekst
            rollback: Povuci odobrenje
            back: Nazad na spisak
        preview:
          title: "Pregled odgovora: %{title}"
          intro: Ovako bi Milica odgovorila na pitanje, s tekstom iz nacrta. Isporučeni odgovor je ispod radi poređenja.
          query_label: Pitanje građanina
          locale_label: Jezik odgovora
          render: Prikaži
          draft_heading: Odgovor iz nacrta
          shipped_heading: Isporučeni odgovor
          state_note: "Stanje: %{state}"
          back: Nazad na uređivanje
        update:
          saved: Nacrt je sačuvan. Građani ga ne vide dok ga ne odobriš.
        approve:
          approved: Odobreno. Milica od sada koristi ovaj tekst.
          invalid: Nacrt nije valjan — provjeri polja.
          not_authorized: Nemate ovlašćenje da odobrite ovaj odgovor.
        rollback:
          rolled_back: Odobrenje je povučeno. Milica koristi isporučeni odgovor.
          not_approved: Ovaj odgovor nije odobren, nema šta da se povuče.
          not_authorized: Nemate ovlašćenje da povučete ovo odobrenje.
      foundation_status:
        menu: Status poziva fondacije
        navigation_description: Postavi da li je poziv „Prijavi ideju“ otvoren i do kada pregled važi.
        show:
          title: Status poziva „Prijavi ideju“
          intro: Milica ovim odgovara na pitanja da li je poziv otvoren. Bez odobrenog unosa važi isporučena datoteka; kad pregled istekne, Milica prestaje da tvrdi činjenice i traži novi pregled.
          effective_heading: Trenutno važi
          effective_source_yaml: isporučena datoteka (foundation_sources.yml)
          unconfigured: Referentni čitač nije podešen. Pripremite vlastite pregledane izvore prije uključivanja; sama izmjena statusa ne uključuje čitač.
          effective_source_override: odobreni unos operatera
          effective_row: "Status: %{status} · pregledano %{reviewed_on} · važi do %{expires_on} · izvor: %{source}"
          fields:
            current_open_status: Status poziva
            reviewed_on: Datum pregleda
            review_expires_on: Pregled važi do
          statuses:
            open: otvoren
            closed: zatvoren
            unverified: neprovjeren
          help: Izmjene se čuvaju kao nacrt; Milica koristi samo odobreni unos. Podsjetnik stiže u nedjeljnom analitičkom sažetku 14 dana prije isteka.
          actions:
            save: Sačuvaj nacrt
            approve: Odobri
            rollback: Povuci odobrenje
            back: Nazad na FAQ odgovore
        update:
          saved: Nacrt je sačuvan. Milica ga koristi tek nakon odobrenja.
        approve:
          approved: Odobreno. Milica koristi ovaj status i ove datume.
          invalid: Unos nije valjan — provjeri datume i status.
          not_authorized: Nemate ovlašćenje da odobrite ovaj unos.
        rollback:
          rolled_back: Odobrenje je povučeno. Važi isporučena datoteka.
          not_approved: Unos nije odobren, nema šta da se povuče.
          not_authorized: Nemate ovlašćenje da povučete ovo odobrenje.
        digest_reminder:
          expiring: "Status poziva fondacije: pregled ističe %{date} (preostalo dana: %{days}). Obnovi ga ovdje: %{url}"
          expired: "Status poziva fondacije: pregled je istekao %{date} — Milica više ne potvrđuje status poziva. Obnovi ga ovdje: %{url}"
