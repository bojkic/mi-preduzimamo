en:
  activerecord:
    attributes:
      decidim_app/bijeljina/city_service_entry:
        key: Key
        title: Title
        body: Answer text
        source_url: Source (link)
        source_checked_on: Source checked on
        state: State
      decidim_app/bijeljina/foundation_status_override:
        current_open_status: Call status
        reviewed_on: Reviewed on
        review_expires_on: Review valid until
        state: State
    errors:
      models:
        decidim_app/bijeljina/city_service_entry:
          attributes:
            key:
              not_shipped: is not one of the shipped FAQ answers
            source_url:
              not_public_http: must be a public http(s) link without credentials
            source_checked_on:
              in_future: cannot be in the future
        decidim_app/bijeljina/foundation_status_override:
          attributes:
            reviewed_on:
              in_future: cannot be in the future
            review_expires_on:
              not_after_reviewed_on: must be after the review date
  decidim_app:
    admin:
      city_service_entries:
        menu: FAQ answers (Milica)
        navigation_description: Fix a city-service FAQ answer without a deploy; citizens see it only after approval.
        states:
          shipped: Shipped (unchanged)
          draft: Draft — citizens never see it
          approved: Approved — Milica uses this text
          rolled_back: Rolled back — the shipped text is used
          approval_stale: Edited after approval — the shipped text is used
        index:
          title: City-service FAQ answers
          intro: Each row is one shipped answer. Edit it into a draft, preview how Milica says it, then approve. Citizens never see a draft.
          columns:
            key: Key
            title: Title
            state: State
            source_checked_on: Source checked
            approved_at: Approved
            actions: Actions
          actions:
            edit: Edit
            preview: Preview answer
            approve: Approve
            rollback: Roll back
            rollback_confirm: Roll back the approved text? Milica returns to the shipped answer immediately.
            foundation_status: Foundation call status
        edit:
          title: "Edit answer: %{title}"
          intro: Changes are saved as a draft. Milica uses the new text only once you approve it; until then the shipped answer applies.
          shipped_heading: Shipped text
          fields:
            title: Title
            body: Answer text
            source_url: Source (link)
            source_checked_on: Source checked on
          help:
            source_host: Link to the official source. If the domain is not in the reviewed source registry, Milica quotes the answer text only, without a separate source link.
            approval: Approval records a content fingerprint (SHA-256 of title, text and link), the time and the operator. Any later edit returns the answer to draft.
          source_host_warning: "The domain %{host} is not in the reviewed source registry — the link will not be cited separately with the answer."
          actions:
            save: Save draft
            preview: Preview answer
            approve: Approve this text
            rollback: Withdraw approval
            back: Back to the list
        preview:
          title: "Preview answer: %{title}"
          intro: This is how Milica would answer the question with the draft text. The shipped answer is below for comparison.
          query_label: Citizen's question
          locale_label: Answer language
          render: Render
          draft_heading: Draft answer
          shipped_heading: Shipped answer
          state_note: "State: %{state}"
          back: Back to editing
        update:
          saved: Draft saved. Citizens do not see it until you approve it.
