sr-Cyrl:
  mi_project_choice:
    eyebrow: Комшилуци бирају
    title: Одабери пројекат за свој комшилук
    intro: Заједница отвара избор пројеката за укључене комшилуке. Овдје су доступни приједлози, разговор, правила
      и гласање.
    choose: Изабери комшилук
    choose_help: Приједлози и гласови воде се одвојено за сваки комшилук.
    budget: Буџет је наведен у правилима процеса
    submit: Предложи пројекат
    browse: Погледај приједлоге и разговарај
    ballot: Погледај пројекте и гласај
    results: Погледај резултате
    card_help: Имаш идеју за овај комшилук? Опиши је, објасни коме користи и предложи како да се изведе.
    login_hint: За објаву приједлога или коментара потребно је да се пријавиш и потврдиш број телефона.
    how: Како бирамо пројекат
    now: У току
    next: Слиједи
    done: Завршено
    phase_0: Предлагање и разговор
    phase_1: Провјера изводљивости
    phase_2: Гласање
    phase_3: Резултати и реализација
    step_0: Грађани објављују идеје и разговарају о њима. Приједлог треба да објасни шта се ради, гдје, коме користи
      и колико оквирно кошта.
    step_1: Тим заједнице провјерава трошкове, сагласности и изводљивост прије гласања.
    step_2: Чланови укључених комшилука бирају пројекат према објављеним правилима процеса.
    step_3: Објављујемо резултат избора и информације о реализацији изабраног пројекта у сваком комшилуку.
    open_0: Предлагање је отворено. Гласање још није почело. Рок за приједлоге и термин гласања биће објављени на
      овој страници.
    open_1: Нови приједлози више се не примају. У току је провјера изводљивости, а разговор о идејама остаје отворен.
      Термин гласања биће објављен овдје.
    open_2: Гласање је отворено. Изабери један пројекат за свој комшилук. Ако се предомислиш, прво повуци претходни
      глас, па изабери други пројекат.
    open_3: Гласање је завршено. На страницама комшилука можеш погледати резултате и пратити наредне кораке.
    participation: Ко може учествовати?
    propose_rule: Право предлагања и коментарисања уређено је правилима процеса и провјерава се кроз налог.
    vote_rule: Право гласа провјерава се према потврђеном налогу и припадности комшилуку укљученом у процес. Гласање
      је могуће док траје одговарајућа фаза.
    vote_note: Једна особа има један глас у свом комшилуку. Бодови из Трке не доносе додатне гласове.
    idea_title: Шта треба да садржи приједлог?
    idea_intro: Не треба ти готов елаборат. Важно је да комшије разумију идеју, њену корист и оквирни трошак.
    idea_1: Шта желиш да се уради и на којој јавној локацији?
    idea_2: Коме пројекат користи и који проблем рјешава?
    idea_3: Шта је потребно купити или урадити и колики је оквирни трошак у оквиру буџета процеса?
    idea_4: Да ли су потребне сагласности и како би се резултат одржавао?
    archive: Архива претходних циклуса
    archive_help: Архива приказује објављене резултате и правила завршених циклуса ове заједнице.
    archive_link: Погледај архиву Трке
    back: Како бирамо и ко може гласати
    other: Други комшилук
    component_intro: Овдје предлажемо и бирамо пројекат за комшилук %{name}, у оквиру буџета и правила процеса.
    empty_title: Прва идеја може бити твоја
    empty_body: Још нема објављених приједлога за овај комшилук. Предложи конкретно побољшање и покрени разговор
      с комшијама.
    empty_wait: Приједлози још нису објављени. Информације о наредним корацима потражи на страници процеса.
    filter: Претражи и филтрирај приједлоге
    no_results: Нема приједлога који одговарају изабраним филтерима.
    clear_filters: Прикажи све приједлоге
    action_title: Укључи се
    proposal_help: Опиши изводљиву идеју за %{name}. Наведи јавну локацију, корист, оквирне трошкове, сагласности
      и одржавање у оквиру буџета процеса.
    proposal_template: 'Шта предлажем?


      Јавна локација:


      Коме користи и који проблем рјешава?


      Шта је потребно и колики је оквирни трошак?


      Потребне сагласности и одржавање:'
    form_help: Пиши јасно и без приватних контаката или туђих личних података. Приједлог ће бити јаван.
    preview_help: Прочитај приједлог и провјери да је изабран прави комшилук. Кликни „Објави приједлог” да постане
      видљив другима — сачуван нацрт још није јаван.
    archive_body: <p>Објављени резултати завршених циклуса доступни су у архиви процеса. Ова инсталација не садржи
      резултате других заједница.</p>
    archive_results: Коначан поредак и правила Трке
    back_process: Назад на избор пројеката
    summary: Предложи идеју, разговарај с комшијама и учествуј у избору пројекта према правилима ове заједнице.
    subtitle: Заједнички пројекти за укључене комшилуке
    image_alt: Илустрација комшија које разматрају идеје за заједнички простор и гласају за пројекат.
