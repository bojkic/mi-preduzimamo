sr-Cyrl:
  decidim_app:
    admin:
      city_service_events:
        index:
          milica_source_access_help: "Милица може користити прикупљене податке и прије прегледа, уз јасно означене непровјерене чињенице. Преглед побољшава податке; објаве на табли и обавјештења имају засебне контроле."
          reviewed_source_help: "Изворне чињенице су прегледане. Милица користи и непрегледане изворе уз ознаку неизвјесности."
          actions:
            save_review: Сачувај преглед
          bulk:
            title: "Групни преглед"
            select: "Одабери"
            select_event: "Одабери: %{title}"
            select_page: "Одабери сва доступна обавјештења на овој страници"
            help: "Радња обухвата само одабрана обавјештења на чекању или с грешком. Напомена је обавезна. Ове радње не објављују на табли нити шаљу обавјештења."
            review: "Означи одабрано као прегледано"
            dismiss: "Одбаци одабрано"
        bulk_review:
          updated: "Ажурирано је %{count} одабраних обавјештења."
          invalid_selection: "Одаберите 1–80 обавјештења, радњу и унесите напомену."
          stale_review: "Одабрано обавјештење је измијењено или више није могуће уређивање. Освјежите страницу; ништа није промијењено."
          not_authorized: "Немате овлашћење за преглед ових обавјештења."
