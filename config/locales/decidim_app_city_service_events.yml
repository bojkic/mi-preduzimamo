        none: "I do not currently have an active service notice for %{area}."
        none_checked: "Source %{source} was checked at %{checked_at}, but I have no reviewed notice about %{service} for %{area}. This does not confirm there is no interruption."
        none_reviewed: "Source %{source} was read successfully at %{checked_at}, but I have no reviewed notice about %{service} for %{area}. This does not confirm there is no interruption."
        pending_review: "Source %{source} was checked at %{checked_at}, but found content has not yet been reviewed and published by an operator. I have no reviewed notice about %{service} for %{area}."
        source_malformed: "The content from %{source} cannot currently be read reliably. I cannot confirm the status of %{service} for %{area}."
        source_stale: "The last successful check of %{source} is stale (%{checked_at}). I cannot confirm the current status of %{service} for %{area}."
        source_unavailable: "The source for %{service} is currently unavailable. I cannot confirm the status for %{area}."
        source_unreviewed: "Source %{source} is reachable, but it has no supported reviewed extraction for this answer. I cannot confirm the status of %{service} for %{area}."
        services:
          electricity: electricity outages
          heating: heating interruptions
          water: water-supply interruptions
        your_area: your area
