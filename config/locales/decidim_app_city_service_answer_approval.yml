sr-Cyrl:
  decidim_app:
    admin:
      city_service_events:
        states:
          answer_approved: "Прегледане изворне чињенице"
        index:
          actions:
            revoke_answers: "Повуци одобрење за одговоре"
            approve_answers: "Одобри за Миличине одговоре"
            approve_answers_help: "Провјерене чињенице постају доступне на упит. Не креира објаву на табли нити шаље обавјештења."
            answers_approved_help: "Милица може користити ове чињенице. Објава на табли је засебан корак."
        approve_answers:
          approved: "Прегледане изворне чињенице. Нема нове објаве ни обавјештења."
          stale_review: "Изворна верзија или приказане чињенице су измијењене. Освјежите страницу и прегледајте поново."
          incomplete_evidence: "Одобрење захтијева потпун извор и ваљану врсту, вријеме и подручје."
          not_authorized: "Немате овлашћење да одобрите ово обавјештење."
        revoke_answers:
          revoked: "Преглед је повучен. Милица задржава изворне податке уз ознаку неизвјесности."
          stale_review: "Обавјештење је измијењено. Освјежите страницу прије повлачења одобрења."
          not_authorized: "Немате овлашћење да повучете ово одобрење."
