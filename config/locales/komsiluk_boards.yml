      local_hide_help: За скривање само на овој табли користите одлуку „Сакриј“ на прегледу објаве. Овдје управљате изворним обавјештењем и свим повезаним таблама.
      impact: Обухват одлуке
      pending:
        one: "%{count} члан још нема ставку у пријемном сандучету."
        few: "%{count} члана још немају ставку у пријемном сандучету."
        other: "%{count} чланова још нема ставку у пријемном сандучету."
      phone_records:
        one: "%{count} евидентиран телефонски налог."
        few: "%{count} евидентирана телефонска налога."
        other: "%{count} евидентираних телефонских налога."
      handoff_help: Повлачење зауставља преостале апликацијске испоруке. Поруке које је пружалац већ прихватио могу наставити испоруку; њихов статус је на прегледу објаве.
      reason: Разлог одлуке
      one_source_help: Ова одлука повлачи овај извор. Други важећи извори истог обавјештења могу задржати објаву на таблама.
      correct_source: Повуци овај извор ради исправке
      withdraw_source: Повуци овај извор
      open_source_review: Отвори преглед извора
      withdraw_all: Повуци обавјештење са свих табли
      all_sources_help: Повлачење свих тренутно објављених извора утиче на %{count} повезаних табли. Прегледајте њихов списак изнад.
      confirm_withdraw_all: Потврди повлачење са свих повезаних табли
      scope:
        citywide: Подручје града
        part: 'Дио наведеног подручја: %{area}. Објава на табли не потврђује да је свако домаћинство погођено.'
        affected: 'Наведено подручје: %{area}'
      phone_scope:
        blocked: 'Телефонско слање није дозвољено: извор одређује шири обухват табле, без потврђеног обухвата домаћинстава.'
        review: Телефонско слање тражи засебан преглед примаоца, канала, рока и садржаја.
      results:
        withdrawn: Обавјештење је повучено у изабраном обухвату.
        correction: Извор је повучен ради исправке. Прегледајте измјене и поново одобрите објаву.
        stale_review: Обавјештење се промијенило или је преглед истекао. Прегледајте тренутни обухват и поновите одлуку.
        not_authorized: Немате овлашћење за управљање градским обавјештењима.
        invalid_action: Изаберите понуђену одлуку.
        note_required: Унесите разлог одлуке, до 2.000 знакова.
        not_publishable: Нема тренутно објављеног извора за ову одлуку.
