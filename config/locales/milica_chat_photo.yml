sr-Cyrl:
  bijeljina:
    milica_chat_photo:
      disabled: "Фотографије за сада не могу примити на овом каналу. Пријаву могу запримити и без слике, а фотографију можеш додати кроз образац на /biceriseno/prijave."
      stored: "Сачувала сам фотографију уз ову пријаву. Шаљем је тек кад потврдиш пријаву."
      too_large: "Слика је превелика — могу примити фотографију до 5 MB. Пошаљи мању или је додај кроз образац на /biceriseno/prijave."
      invalid_type: "Овај формат слике не могу прихватити. Пошаљи фотографију као JPG, PNG или WEBP."
      fetch_failed: "Нисам успјела преузети слику. Пошаљи је поново па ћу је закачити уз пријаву."
      expired: "Слика више није доступна код пошиљаоца. Пошаљи је поново па ћу је закачити уз пријаву."
      disclosure: "Фотографија није јавно објављена уз пријаву: виде је само овлаштени оператери и надлежна градска служба. Јавни су број пријаве, категорија, тачка на мапи и адреса, статус и датум."
      preview_line: "Фотографија: приложена."
en:
  bijeljina:
    milica_chat_photo:
      disabled: "I cannot accept photos on this channel yet. I can still take your report without one, and you can add a photo through the form at /biceriseno/prijave."
      stored: "I have kept the photo with this report. I only send it once you confirm the report."
      too_large: "The photo is too large — I can take a photo up to 5 MB. Send a smaller one, or add it through the form at /biceriseno/prijave."
      invalid_type: "I cannot accept this image format. Send the photo as JPG, PNG or WEBP."
      fetch_failed: "I could not download the photo. Send it again and I will attach it to the report."
      expired: "The photo is no longer available from the sender. Send it again and I will attach it to the report."
      disclosure: "The photo is not published publicly with the report: only authorised operators and the responsible city service see it. What is public is the report number, category, map point and address, status and date."
      preview_line: "Photo: attached."
