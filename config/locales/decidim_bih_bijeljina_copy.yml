    invitation_rules:
      title: Pravila pozivnica zajednice
      who_title: Ko može učestvovati.
      who: Pozivnice su bile namijenjene osobama s potvrđenim telefonom. Jedna osoba — jedan nalog — jedna pozivnica.
      condition_title: Uslov.
      condition: Uslove za pozivnice određuje tim zajednice prije aktivacije.
      count_title: Broj pozivnica.
      count: Broj pozivnica prikazuje se nakon konfiguracije događaja.
      confirm_title: Potvrda dolaska.
      confirm: Potvrda dolaska bila je molba, ne uslov. Evidencija izdate pozivnice i potvrde dolaska nije sama
        po sebi dokaz ulaska na događaj.
      entry_title: Ulaz.
      entry: Događaj je završen. Ranije izdata pozivnica ostaje dio tvoje evidencije.
      waitlist_title: Ako ostaneš bez pozivnice.
      waitlist: Izdavanje i lista čekanja za ovaj događaj su završeni. Bodovi ostaju za aktivnosti i raspoložive
        nagrade zajednice.
      forbidden_title: Šta ne prolazi.
      forbidden: Lažni nalozi, više naloga jedne osobe i naduvavanje bodova ponavljanjem istih radnji. Takvi nalozi
        gube pravo na pozivnicu.
      not_money_title: Bodovi nisu novac.
      not_money: Nemaju novčanu vrijednost, ne mogu se zamijeniti za novac i ne utiču na glasanje, na rang prijedloga
        ni na vidljivost sadržaja.
      correction: Organizator zadržava pravo da ispravi očiglednu grešku u obračunu i da o tome javno obavijesti.
    race_rules:
      window: '%{window_from} – %{window_to}'
      prize_amount: Prema pravilima zajednice
      prize_grad: Gradski komšiluk
      prize_selo: Seoski komšiluk
      prize_note: za projekat koji komšiluk sam izabere
      points_title: Šta koliko nosi
      points_registered: registrovan komšija
      points_report: prijava problema
      points_proposal: prijedlog
      rules_title: Pravila trke
      title: Trka komšiluka
      intro: Obuhvat takmičenja, nagrade i uslove zajednica objavljuje prije početka.
      formula_title: 'Kako se broji:'
      formula: registrovani × %{registration_points} + prijave × %{report_points} + prijedlozi × %{proposal_points}
      rule_1: Za svaku bodovanu radnju potreban je potvrđen telefon. Boduje se aktivnost u objavljenom periodu trke;
        anonimnost kontakta prema službi ne umanjuje rezultat.
      rule_2: Duplikati, potvrde „Isti problem” i odbijene prijave ne donose bodove trke. Objavljen prijedlog građanina
        koji nije izabran za realizaciju ostaje prihvatljiv; skriven ili obrisan nedozvoljen sadržaj se isključuje.
      rule_3: Po osobi se boduje najviše %{report_cap} prijava i %{proposal_cap} prijedloga tokom cijele trke. To
        su zasebne granice od ličnih bodova zajedništva.
      rule_4: Kod istog rezultata prednost ima komšiluk koji je ranije dostigao taj rezultat. Potpuno izjednačenje
        razrješava administrator uz zabilježen razlog.
      time_title: 'Vrijeme:'
      time: Radnje se računaju od %{window_from} do %{window_to} po vremenu u Sarajevu; krajnji trenutak ne ulazi
        u obračun. Poslije zatvaranja slijedi pregled. Javne bodove administrator kasnije može ručno sakriti.
      announce_title: 'Proglašenje:'
      announce: Nakon zatvaranja, pregleda izvora i potvrde konačnog poretka. Zatvaranje trke samo po sebi nije
        proglašenje pobjednika.
      build_title: 'Šta se gradi:'
      build: Izbor projekata, budžet, datumi i biračko pravo uređuju se pravilima procesa. Bodovi sami ne dodjeljuju
        dodatne glasove.
      no_politics: Trka nema veze sa političkim organizovanjem i ne može se koristiti u predizbornoj kampanji. Prijave
        i prijedlozi sa stranačkim sadržajem se brišu i ne računaju.
      rule_5: Doprinos ostaje prvom komšiluku pouzdano utvrđenom za ovu trku. Promjena komšiluka ne premješta ranije
        bodove. I zaposleni mogu doprinijeti trci; njihov pojedinačni doprinos nije u javnom poretku građana.
    moderation:
      title: Šta se briše sa platforme MI
      item_1: govor mržnje i vrijeđanje po nacionalnoj, vjerskoj, polnoj i svakoj drugoj osnovi
      item_2: lični napadi na imenovane osobe
      item_3: stranačka kampanja i poziv na glasanje za bilo koga
      item_4: fotografije na kojima se jasno vide lica ili registarske tablice, kada to nije nužno za prijavu
      item_5: lični podaci drugih ljudi — ime i adresa komšije, broj telefona, slika tuđeg dvorišta
      item_6: reklame i ponavljani isti sadržaj
      item_7: očigledno neistinite prijave
      sharp: Prijavu i prijedlog možeš uvijek napisati oštro. Razlika je u tome da li govoriš o problemu ili o čovjeku.
      appeal: Tim zajednice objavljuje postupak moderacije i žalbe. Obrati mu se za preispitivanje odluke.
      campaign_period: Posebne periode i pravila moderacije zajednica objavljuje prije primjene.
    neutrality:
      title: MI nije ničija kampanja.
      p1: Organizator i finansijeri navode se u pravilima vaše zajednice.
      p2: Pravila događaja i učešća javnih predstavnika objavljuje organizator zajednice.
      p3: Stranačka obilježja u sali nisu dozvoljena. Stranački sadržaj na platformi se briše.
      p4: Ovo pišemo unaprijed, dok kampanja traje, da niko ne bi morao da nagađa.
    faq:
      title: Često postavljana pitanja
      q1: Da li još mogu dobiti pozivnicu za lansiranje?
      a1: Datumi događaja i pozivnice zavise od podešavanja zajednice.
      q2: Šta sada mogu uraditi na platformi?
      a2: Prijavi stvaran problem, učestvuj u otvorenim procesima, volontiraj ili pozovi komšije. Pravila bodovanja
        i granice su na kartici Zajedništvo.
      q3: Koliko mi treba za registraciju?
      a3: Potreban je pristup platformi i vlastiti telefon za SMS potvrdu. Vrijeme zavisi od dostave koda i unosa
        podataka.
      q4: Šta ako nemam pametni telefon?
      a4: 'Pametni telefon nije uslov: platformu možeš otvoriti na računaru i samostalno unijeti kod primljen na
        vlastiti telefon. Ne nudimo službu otvaranja naloga umjesto građana. Telefon koji prima SMS ostaje uslov
        verifikacije.'
      q5: Kako se računaju pozivi komšijama?
      a5: Podijeli lični link. Potvrđen telefon i izabran komšiluk dovoljni su za kvalifikaciju; postoje odgoda
        i mjesečni limit, a višak kvalifikovanih poziva prelazi u naredni mjesec. Komšija doprinosi vlastitom komšiluku.
      q6: Da li bodovi nestaju poslije događaja ili trke?
      a6: Ne. Novčanik i priznati doprinos odvojeni su od trke. Trošenje, pokloni i obrazložene ispravke imaju svoja
        pravila u istoriji naloga.
      q7: Ko vidi moju prijavu?
      a7: Javno se vide broj, kategorija, adresa problema, tačka na mapi, status i datum. Ime prijavioca nije prikazano.
        Opis, fotografija i kontakt dostupni su ovlaštenom timu i nadležnoj službi prema pravilima pristupa; predaja
        službi slijedi pregled, nije automatska objava svake prijave.
      q8: Da li čuvate moju adresu?
      a8: Registracija čuva telefon i izabrani komšiluk. Ako zatražiš provjeru adrese pismom, adresa je potrebna
        za dostavu i privremeno se obrađuje prema pravilima tog postupka. Adresa problema i označena tačka na mapi
        jesu javni podaci prijave.
      q9: Šta znače bodovi?
      a9: Bodovi zajedništva su priznanje i stanje za simbolične nagrade, bez novčane vrijednosti ili dodatne glasačke
        moći. Trka ima zaseban obračun. Javna priznanja možeš isključiti u svom nalogu.
      q10: Ko ovo plaća?
      a10: Zajednica objavljuje svog organizatora i finansijere.
    about:
      title: Ko smo i ko ovo plaća
      body: Platformom upravlja organizator vaše zajednice. Kontakti i odgovornosti uređuju se prije pokretanja.
      funding_title: Izvori finansiranja
      funding: Zajednica objavljuje sopstvene izvore finansiranja i izvještaje.
      grant_title: Projektna podrška
      grant: Zajednica dodaje sopstvene odobrene navode o podršci i obavezne napomene.
