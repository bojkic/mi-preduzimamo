      entry: Догађај је завршен. Раније издата позивница остаје дио твоје евиденције.
      waitlist_title: Ако останеш без позивнице.
      waitlist: Издавање и листа чекања за овај догађај су завршени. Бодови остају за активности и расположиве награде
        заједнице.
      forbidden_title: Шта не пролази.
      forbidden: Лажни налози, више налога једне особе и надувавање бодова понављањем истих радњи. Такви налози
        губе право на позивницу.
      not_money_title: Бодови нису новац.
      not_money: Немају новчану вриједност, не могу се замијенити за новац и не утичу на гласање, на ранг приједлога
        ни на видљивост садржаја.
      correction: Организатор задржава право да исправи очигледну грешку у обрачуну и да о томе јавно обавијести.
    race_rules:
      window: '%{window_from} – %{window_to}'
      prize_amount: Према правилима заједнице
      prize_grad: Градски комшилук
      prize_selo: Сеоски комшилук
      prize_note: за пројекат који комшилук сам изабере
      points_title: Шта колико носи
      points_registered: регистрован комшија
      points_report: пријава проблема
      points_proposal: приједлог
      rules_title: Правила трке
      title: Трка комшилука
      intro: Обухват такмичења, награде и услове заједница објављује прије почетка.
      formula_title: 'Како се броји:'
      formula: регистровани × %{registration_points} + пријаве × %{report_points} + приједлози × %{proposal_points}
      rule_1: За сваку бодовану радњу потребан је потврђен телефон. Бодује се активност у објављеном периоду трке;
        анонимност контакта према служби не умањује резултат.
      rule_2: Дупликати, потврде „Исти проблем” и одбијене пријаве не доносе бодове трке. Објављен приједлог грађанина
        који није изабран за реализацију остаје прихватљив; скривен или обрисан недозвољен садржај се искључује.
      rule_3: По особи се бодује највише %{report_cap} пријава и %{proposal_cap} приједлога током цијеле трке. То
        су засебне границе од личних бодова заједништва.
      rule_4: Код истог резултата предност има комшилук који је раније достигао тај резултат. Потпуно изједначење
        разрјешава администратор уз забиљежен разлог.
      time_title: 'Вријеме:'
      time: Радње се рачунају од %{window_from} до %{window_to} по времену у Сарајеву; крајњи тренутак не улази
        у обрачун. Послије затварања слиједи преглед. Јавне бодове администратор касније може ручно сакрити.
      announce_title: 'Проглашење:'
      announce: Након затварања, прегледа извора и потврде коначног поретка. Затварање трке само по себи није проглашење
        побједника.
      build_title: 'Шта се гради:'
      build: Избор пројеката, буџет, датуми и бирачко право уређују се правилима процеса. Бодови сами не додјељују
        додатне гласове.
      no_politics: Трка нема везе са политичким организовањем и не може се користити у предизборној кампањи. Пријаве
        и приједлози са страначким садржајем се бришу и не рачунају.
      rule_5: Допринос остаје првом комшилуку поуздано утврђеном за ову трку. Промјена комшилука не премјешта раније
        бодове. И запослени могу допринијети трци; њихов појединачни допринос није у јавном поретку грађана.
    moderation:
      title: Шта се брише са платформе МИ
      item_1: говор мржње и вријеђање по националној, вјерској, полној и свакој другој основи
      item_2: лични напади на именоване особе
      item_3: страначка кампања и позив на гласање за било кога
      item_4: фотографије на којима се јасно виде лица или регистарске таблице, када то није нужно за пријаву
      item_5: лични подаци других људи — име и адреса комшије, број телефона, слика туђег дворишта
      item_6: рекламе и понављани исти садржај
      item_7: очигледно неистините пријаве
      sharp: Пријаву и приједлог можеш увијек написати оштро. Разлика је у томе да ли говориш о проблему или о човјеку.
      appeal: Тим заједнице објављује поступак модерације и жалбе. Обрати му се за преиспитивање одлуке.
      campaign_period: Посебне периоде и правила модерације заједница објављује прије примјене.
    neutrality:
      title: МИ није ничија кампања.
      p1: Организатор и финансијери наводе се у правилима ваше заједнице.
      p2: Правила догађаја и учешћа јавних представника објављује организатор заједнице.
      p3: Страначка обиљежја у сали нису дозвољена. Страначки садржај на платформи се брише.
      p4: Ово пишемо унапријед, док кампања траје, да нико не би морао да нагађа.
    faq:
      title: Често постављана питања
      q1: Да ли још могу добити позивницу за лансирање?
      a1: Датуми догађаја и позивнице зависе од подешавања заједнице.
      q2: Шта сада могу урадити на платформи?
      a2: Пријави стваран проблем, учествуј у отвореним процесима, волонтирај или позови комшије. Правила бодовања
        и границе су на картици Заједништво.
      q3: Колико ми треба за регистрацију?
      a3: Потребан је приступ платформи и властити телефон за СМС потврду. Вријеме зависи од доставе кода и уноса
        података.
      q4: Шта ако немам паметни телефон?
      a4: 'Паметни телефон није услов: платформу можеш отворити на рачунару и самостално унијети код примљен на
        властити телефон. Не нудимо службу отварања налога умјесто грађана. Телефон који прима СМС остаје услов
        верификације.'
      q5: Како се рачунају позиви комшијама?
      a5: Подијели лични линк. Потврђен телефон и изабран комшилук довољни су за квалификацију; постоје одгода и
        мјесечни лимит, а вишак квалификованих позива прелази у наредни мјесец. Комшија доприноси властитом комшилуку.
      q6: Да ли бодови нестају послије догађаја или трке?
      a6: Не. Новчаник и признати допринос одвојени су од трке. Трошење, поклони и образложене исправке имају своја
        правила у историји налога.
      q7: Ко види моју пријаву?
      a7: Јавно се виде број, категорија, адреса проблема, тачка на мапи, статус и датум. Име пријавиоца није приказано.
        Опис, фотографија и контакт доступни су овлаштеном тиму и надлежној служби према правилима приступа; предаја
        служби слиједи преглед, није аутоматска објава сваке пријаве.
      q8: Да ли чувате моју адресу?
      a8: Регистрација чува телефон и изабрани комшилук. Ако затражиш провјеру адресе писмом, адреса је потребна
        за доставу и привремено се обрађује према правилима тог поступка. Адреса проблема и означена тачка на мапи
        јесу јавни подаци пријаве.
      q9: Шта значе бодови?
      a9: Бодови заједништва су признање и стање за симболичне награде, без новчане вриједности или додатне гласачке
        моћи. Трка има засебан обрачун. Јавна признања можеш искључити у свом налогу.
      q10: Ко ово плаћа?
      a10: Заједница објављује свог организатора и финансијере.
    about:
      title: Ко смо и ко ово плаћа
      body: Платформом управља организатор ваше заједнице. Контакти и одговорности уређују се прије покретања.
      funding_title: Извори финансирања
      funding: Заједница објављује сопствене изворе финансирања и извјештаје.
      grant_title: Пројектна подршка
      grant: Заједница додаје сопствене одобрене наводе о подршци и обавезне напомене.
  mi_funders:
    eyebrow: Партнери заједнице
    line: Подршку овој инсталацији наводи ваша заједница.
