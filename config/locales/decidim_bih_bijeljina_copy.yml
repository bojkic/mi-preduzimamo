      count_title: Број позивница.
      count: Број позивница приказује се након конфигурације догађаја.
      confirm_title: Потврда доласка.
      confirm: Потврда доласка била је молба, не услов. Евиденција издате позивнице и потврде доласка није сама
        по себи доказ уласка на догађај.
