  layouts:
    decidim:
      header:
        register: Sign up
        ask_milica: Ask Milica
  mi_launch:
    invitation_rules:
      title: Community invitation rules
      who: Invitations were for people with a verified phone. One person — one account — one invitation.
      condition: The community team sets invitation requirements before activation.
      count: Invitation quantities appear after the event is configured.
      confirm: Attendance confirmation was requested, not required. An invitation or attendance confirmation record
        alone does not prove entry.
      entry: The event has ended. Previously issued invitations remain in your records.
      waitlist: Issuance and the waiting list for this event have ended. Points remain for community activities
        and available rewards.
    race_rules:
      window: '%{window_from} – %{window_to}'
      title: Neighbourhood race
      formula: registered × %{registration_points} + reports × %{report_points} + proposals × %{proposal_points}
      rule_1: Every scored action requires a verified phone. Activity must fall within the published contest window;
        withholding contact details from the city does not reduce the score.
      rule_2: Duplicates, “Same problem” confirmations and rejected reports earn no race points. Published citizen
        proposals not selected for implementation remain eligible; hidden or deleted prohibited content is excluded.
      rule_3: Each person can contribute at most %{report_cap} reports and %{proposal_cap} proposals throughout
        the race. These limits are separate from personal community points.
      rule_4: Equal scores are ordered by which neighbourhood reached that score first. An administrator resolves
        a complete tie with a recorded reason.
      rule_5: Contribution stays with the first neighbourhood reliably established for this race. Moving does not
        transfer earlier points. Staff may contribute to the race but are excluded from citizen individual public
        rankings.
      time: Actions count from %{window_from} until %{window_to}, Sarajevo time, excluding the endpoint. Review
        follows closure. An administrator may later hide public race scores manually.
      announce: After closure, source review and approval of final standings. Closing the race does not by itself
        declare a winner.
      build: Project selection, budgets, dates and voting eligibility follow process rules. Points alone grant no
        extra votes.
    faq:
      q1: Can I still earn a launch invitation?
      a1: Event dates and invitations depend on your community settings.
      q2: What can I do now?
      a2: Report a real problem, join open processes, volunteer or invite neighbours. Community contains the earning
        rules and limits.
      q3: What do I need to register?
      a3: Access to the platform and your own phone for SMS verification. Time depends on code delivery and entering
        your details.
      a4: 'A smartphone is not required: open the platform on a computer and enter the code received on your own
        phone. We do not offer an account creation service on behalf of citizens. A phone receiving SMS remains
        necessary for verification.'
      q5: How do invitations to neighbours earn points?
      a5: Share your personal link. Verified phone and selected neighbourhood are enough, with a waiting period
        and monthly limit. Further eligible referrals carry forward. Your neighbour contributes to their own neighbourhood.
      q6: Do points disappear after the event or race?
      a6: No. Your wallet and recognized contribution are separate from the race. Spending, gifts and explained
        corrections appear in account history.
      a7: Reference, category, problem address, map point, status and date are public. The reporter’s name is not
        displayed. Description, photo and contact are restricted to authorized staff and the responsible service;
        forwarding follows review, not every submission automatically.
      a8: Registration retains phone and selected neighbourhood. Postal address verification needs a mailing address,
        processed temporarily under that workflow’s rules. Problem addresses and submitted map points are public
        report information.
      a9: Community points recognize contribution and can be used for symbolic rewards; they have no cash value
        or extra voting power. The race uses a separate calculation. You can disable public recognition in your
        account.
      a10: Your community publishes its operator and funders.
  mi_funders:
    eyebrow: Partneri zajednice
    line: Your community identifies support for this installation.
