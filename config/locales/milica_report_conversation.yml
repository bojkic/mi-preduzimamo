sr:
  bijeljina:
    milica_report:
      preview: |-
        Evo prijave za tvoju provjeru — još ništa nije poslano.
        Opis: %{description}
        Mjesto: %{place}%{location_note}
        %{account}
        Ako je ovo tačno i želiš poslati novu prijavu, pritisni „Potvrdi slanje“ ili napiši „%{command}“.
        Za ispravku napiši šta treba promijeniti. Za odustajanje napiši „odustani“. Potvrda važi 15 minuta.
      preview_typed: |-
        Evo prijave za tvoju provjeru — još ništa nije poslano.
        Opis: %{description}
        Mjesto: %{place}%{location_note}
        %{account}
        Ako je ovo tačno, odgovori tačno ovako: „%{command}“.
        Za ispravku napiši šta treba promijeniti. Za odustajanje napiši „odustani“. Potvrda važi 15 minuta.
      shared_location: "lokacija koju si podijelio/la za ovu prijavu"
      ask_place: "Gdje je problem? Napiši naziv ulice i najbliži broj ili orijentir, ili podijeli trenutnu lokaciju za ovu prijavu."
      location_notice: "Važno: navedena adresa je javno vidljiva. Ako podijeliš GPS lokaciju, i tačna tačka biće javna na karti. Ako to ne želiš, izmijeni mjesto ili odustani prije potvrde."
      disclosure_changed: "Prije slanja provjeri dopunjeno obavještenje o javnoj lokaciji. Prethodna potvrda je zamijenjena; za slanje koristi novu potvrdu ispod."
      account_notice: "Prijava će biti povezana s tvojim nalogom, bez slanja kontakt podataka."
      anonymous_notice: "Prijava je anonimna, bez kontakt podataka."
      confirm_button: "Potvrdi slanje"
      cancel_button: "Odustani"
      cancel_command: "odustani"
      status_button: "Prati prijavu"
      submitted: "Prijava %{reference} je zaprimljena. Obrada i prosljeđivanje službi slijede naknadno; ovo još nije potvrda da je problem riješen.\nPrati status: %{url}"
      expired: "Ova potvrda više ne važi ili ne pripada ovom razgovoru. Napiši ponovo šta želiš prijaviti da ti pokažem novi sažetak. Ništa nisam poslala ovom potvrdom."
      busy: "Još obrađujem prethodnu poruku. Sačekaj trenutak pa pokušaj ponovo."
      unavailable: "Trenutno ne mogu pouzdano potvrditi stanje prijave. Ako si već pritisnuo/la potvrdu, ponovi istu potvrdu — ne otvaraj novu prijavu; provjeriću isti zahtjev bez ponovnog slanja."
      duplicate_notice: "U blizini postoje moguće slične prijave. Pregledaj javne prijave na /biceriseno/prijave prije potvrde. Potvrdi slanje samo ako ipak želiš novu prijavu."
