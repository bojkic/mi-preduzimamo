    budget: Budžet je naveden u pravilima procesa
    submit: Predloži projekat
    browse: Pogledaj prijedloge i razgovaraj
    ballot: Pogledaj projekte i glasaj
    results: Pogledaj rezultate
    card_help: Imaš ideju za ovaj komšiluk? Opiši je, objasni kome koristi i predloži kako da se izvede.
    login_hint: Za objavu prijedloga ili komentara potrebno je da se prijaviš i potvrdiš broj telefona.
    how: Kako biramo projekat
    now: U toku
    next: Slijedi
    done: Završeno
    phase_0: Predlaganje i razgovor
    phase_1: Provjera izvodljivosti
    phase_2: Glasanje
