sr:
  decidim_app:
    milica:
      public_capabilities:
        account_status: "Ako pitaš za nalog na MI platformi: uspješan završetak potvrde telefona vodi na stranicu dobrodošlice ili tvoj nalog. Ako još vidiš korak za unos koda, potvrda nije završena. Prijavi se na %{url} da provjeriš svoj tok; iz ovog razgovora ne vidim stanje tvog naloga. Prijava komunalnog problema je odvojen postupak."
        whatsapp_report: "Da, prijavu problema možeš započeti u WhatsApp razgovoru s Milicom. Prije slanja dobijaš pregled nacrta i moraš poslati traženu tačnu potvrdu; tek potvrda i priznanica znače da je prijava podnesena. Ovaj odgovor ništa ne šalje i ne potvrđuje dostavu poruke na drugom kanalu."
        timetable_link: "Službena objava Grada Bijeljina o redu vožnje gradskog prevoza od 1. septembra 2026. je na %{url}; slike reda vožnje su u galeriji te objave. Objavljeni red nije potvrda da autobus trenutno vozi. Za konkretan polazak napiši odakle, dokle i kada putuješ."
        mz_directory: "Javni imenik mjesnih zajednica je na %{url}. Napiši naziv MZ da provjerim njen objavljeni kontakt. Objavljeni broj ne potvrđuje da je trenutno aktivan."
        neighborhood_street: "Ako misliš na ulicu u Bijeljini, to mogu uzeti kao početno područje pretrage, ali sama ulica ne potvrđuje tačan komšiluk: ista ulica može proći kroz više područja. Treba mi broj objekta ili tačna tačka za ponovnu provjeru; nemoj ovdje slati privatnu adresu ako ne želiš. Komšiluk možeš provjeriti i na %{url}. Mjesna zajednica i komšiluk nisu ista granica."
        air_source: "Službena stranica Grada Bijeljina za podatke o kvalitetu vazduha je %{url}. Postojanje stranice ne potvrđuje mjerenje za danas; provjeri datum i stanicu uz podatak. Ovdje nemam potvrđen današnji indeks ni osnov za zdravstveni zaključak."
        registration: "Otvori %{url}. Unesi tražene podatke i broj telefona, prihvati obavezne uslove i pošalji obrazac. Zatim na stranici za potvrdu otvori primljeni link ili unesi kod. Kod i lozinku ne šalji u chat; ovaj odgovor nije poslao kod niti napravio nalog."
        script: "Na platformi otvori izbor jezika (na telefonu: Više → Jezik) i izaberi Ћирилица ili Latinica: %{url}. Promjena mijenja prikaz i, ako si prijavljen/a, čuva jezik naloga; ne mijenja identitet, verifikaciju ni ostale podatke naloga."
        report_anonymous: "Nalog nije potreban za opisivanje i slanje komunalnog problema kroz javni obrazac: %{url}. Prijava bez prijavljenog naloga ostaje anonimna i neće se kasnije automatski povezati s nalogom. Obrazac javno prikazuje referencu, kategoriju, adresu/tačku problema, status i datum; opis, fotografija i kontakt ostaju privatni za ovlaštenu obradu. Ovdje nisam napravila nalog niti poslala prijavu."
        report_supplement: "Dopunu pošalji na privatnoj stranici prijave preko sačuvanog statusnog linka. Ako je prijava vezana za tvoj nalog, prijavi se i otvori Moje prijave: %{mine_url}. Javni broj ili javna lista %{public_url} ne daju pristup privatnoj dopuni. Ovaj razgovor nije otvorio ni promijenio tvoj predmet."
        channel_opt_out: "Za odjavu od poruka pošiljaoca pošalji tačno ODJAVA ili STOP u istom Viber razgovoru iz kojeg poruke stižu. Ovaj web chat ne može izvršiti odjavu. Izbor tema na %{settings_url} je odvojen i sam ne zaustavlja poruke kod provajdera."
sr-Cyrl:
  decidim_app:
    milica:
      public_capabilities:
        account_status: "Ако питаш за налог на МИ платформи: успјешан завршетак потврде телефона води на страницу добродошлице или твој налог. Ако још видиш корак за унос кода, потврда није завршена. Пријави се на %{url} да провјериш свој ток; из овог разговора не видим стање твог налога. Пријава комуналног проблема је одвојен поступак."
        whatsapp_report: "Да, пријаву проблема можеш започети у WhatsApp разговору с Милицом. Прије слања добијаш преглед нацрта и мораш послати тражену тачну потврду; тек потврда и признаница значе да је пријава поднесена. Овај одговор ништа не шаље и не потврђује доставу поруке на другом каналу."
        timetable_link: "Службена објава Града Бијељина о реду вожње градског превоза од 1. септембра 2026. је на %{url}; слике реда вожње су у галерији те објаве. Објављени ред није потврда да аутобус тренутно вози. За конкретан полазак напиши одакле, докле и када путујеш."
        mz_directory: "Јавни именик мјесних заједница је на %{url}. Напиши назив МЗ да провјерим њен објављени контакт. Објављени број не потврђује да је тренутно активан."
        neighborhood_street: "Ако мислиш на улицу у Бијељини, то могу узети као почетно подручје претраге, али сама улица не потврђује тачан комшилук: иста улица може проћи кроз више подручја. Треба ми број објекта или тачна тачка за поновну провјеру; немој овдје слати приватну адресу ако не желиш. Комшилук можеш провјерити и на %{url}. Мјесна заједница и комшилук нису иста граница."
        air_source: "Службена страница Града Бијељина за податке о квалитету ваздуха је %{url}. Постојање странице не потврђује мјерење за данас; провјери датум и станицу уз податак. Овдје немам потврђен данашњи индекс ни основ за здравствени закључак."
        registration: "Отвори %{url}. Унеси тражене податке и број телефона, прихвати обавезне услове и пошаљи образац. Затим на страници за потврду отвори примљени линк или унеси код. Код и лозинку не шаљи у чет; овај одговор није послао код нити направио налог."
        script: "На платформи отвори избор језика (на телефону: Више → Језик) и изабери Ћирилица или Latinica: %{url}. Промјена мијења приказ и, ако си пријављен/а, чува језик налога; не мијења идентитет, верификацију ни остале податке налога."
        report_anonymous: "Налог није потребан за описивање и слање комуналног проблема кроз јавни образац: %{url}. Пријава без пријављеног налога остаје анонимна и неће се касније аутоматски повезати с налогом. Образац јавно приказује референцу, категорију, адресу/тачку проблема, статус и датум; опис, фотографија и контакт остају приватни за овлаштену обраду. Овдје нисам направила налог нити послала пријаву."
        report_supplement: "Допуну пошаљи на приватној страници пријаве преко сачуваног статусног линка. Ако је пријава везана за твој налог, пријави се и отвори Моје пријаве: %{mine_url}. Јавни број или јавна листа %{public_url} не дају приступ приватној допуни. Овај разговор није отворио ни промијенио твој предмет."
        channel_opt_out: "За одјаву од порука пошиљаоца пошаљи тачно ОДЈАВА или STOP у истом Viber разговору из којег поруке стижу. Овај веб чет не може извршити одјаву. Избор тема на %{settings_url} је одвојен и сам не зауставља поруке код провајдера."
