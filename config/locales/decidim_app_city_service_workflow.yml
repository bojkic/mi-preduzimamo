sr-Cyrl:
  decidim_app:
    admin:
      city_service_events:
        workflow_results:
          save_publish: Сачувај преглед и објави на табли
          reviewed_tab: Прегледано — чека објаву
          withdraw_help: Повлачење уклања објаве са табле и зауставља поруке које чекају слање. Поруке које је пружалац већ прихватио није могуће опозвати. Исправку треба поново објавити.
          correct: Повуци и исправи
          withdraw: Повуци обавјештење
          withdrawn: Обавјештење је повучено. Објаве више нису видљиве, а поруке које чекају слање су заустављене.
          note_required: Унесите разлог повлачења (највише 2000 знакова).
          not_authorized: Немате овлашћење за ову радњу.
          stale_review: Обавјештење је измијењено након отварања. Освјежите страницу и прегледајте нову верзију; ништа није објављено.
          no_target: 'Није објављено: одаберите погођена подручја на основу извора, сачувајте и поновите објаву.'
          invalid_lifecycle: 'Објава није могућа: обавјештење је отказано, завршено, замијењено или нема познат статус.'
          incomplete_source: 'Није објављено: подаци из извора нису потпуни.'
          missing_time: 'Није објављено: унесите вријеме почетка и завршетка.'
          invalid_time: 'Није објављено: завршетак мора бити послије почетка.'
          expired: Обавјештење је истекло и не може се објавити или послати.
          not_publishable: Обавјештење у овом стању није могуће објавити.
          no_publish: Ниједна објава није направљена. Прегледајте обавјештење и покушајте поново.
          already_published: Обавјештење је већ објављено; нису направљене додатне објаве нити поруке.
          board_published: 'Објављено на табли: %{posts} објава. Слање обавјештења није затражено.'
          delivery_queued: Обавјештења чекају слање за %{recipients} прималаца. Ово није потврда доставе.
          delivery_skipped: Обавјештења нису стављене на слање (%{reason}). Објава на табли остаје доступна за преглед.
        update:
          facts_confirmation_required: Потврдите измјене података прије чувања или објаве.
