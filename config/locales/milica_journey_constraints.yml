en:
  decidim_app:
    milica:
      journey_uncertainty:
        walking_range: "Estimated total walking time is roughly %{low}–%{high} minutes; this is not a surveyed walking time."
        close_transfer: "The transfer is tight: a longer actual walk could mean missing the bus."
      unsupported_journey_constraint:
        ordered_via: "I cannot reliably plan a journey that must pass through another place using the reviewed timetable. I can check a departure and estimated arrival for one leg without that condition."
        arrive_by: "I cannot reliably plan a journey with an arrival deadline using the reviewed timetable. I can check a departure and estimated arrival for one leg without that condition."
        both: "I cannot reliably plan a journey that must pass through another place and meet an arrival deadline using the reviewed timetable. I can check a departure and estimated arrival for one leg without those conditions."
