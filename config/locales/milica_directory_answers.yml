en:
  decidim_app:
    milica:
      directory_answers:
        parking_hours_unavailable: "The reviewed parking entry does not include opening hours or charging hours. Check the Parking Service's official page."
        transport_walk_verified: "Walk to the boarding stop %{stop}. The link uses the recorded stop point; choose your starting point in Google Maps."
        transport_walk_provided: "Walk to the boarding stop %{stop}. A local operator supplied these coordinates; check the stop sign on site. Choose your starting point in Google Maps."
        transport_walk_assumed: "Walk to the boarding stop %{stop}. Its position is estimated, so check the stop sign on site. Choose your starting point in Google Maps."
        transport_accessibility_unverified: "I have no verified information about lowered kerbs, safe crossings, step-free access or accessible vehicles. The map does not establish this; check stop and vehicle access with the operator before travelling."
        public_mz_map: "%{name} is a local community (MZ); the link opens its public boundary map. This does not select your komšiluk or grant access to neighborhood posts."
        public_mz_no_map: "%{name} is a local community (MZ), but this record has no available public boundary map. This does not select your komšiluk or grant access to neighborhood posts."
