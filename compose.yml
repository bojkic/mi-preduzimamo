# Operativne komande idu kroz script/mi_install radi vezivanja projekta/endpoint-a.
x-app: &app
  image: ${MI_IMAGE:?Use script/mi_install}
  pull_policy: never
  build:
    context: ./.mi-install/build-context
    target: ${MI_PROFILE:?Use script/mi_install}
    args:
      MI_APP_BUILD_REVISION: ${MI_APP_SHA:?Use script/mi_install}
      MI_RUNTIME_UID: ${MI_RUNTIME_UID:-1000}
  env_file:
    - path: ./.mi-install/app.env
      format: raw
  init: true
  restart: unless-stopped
  stop_grace_period: 90s
  security_opt: [no-new-privileges:true]
  environment:
    RAILS_MAX_THREADS: 3
    WEB_CONCURRENCY: 0
    SIDEKIQ_CONCURRENCY: 2
    MI_HEALTH_HOST: ${MI_DOMAIN}
  volumes: [storage:/app/storage]
  networks: [appnet]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  app:
    <<: *app
    healthcheck:
      test: [CMD-SHELL, 'test "$$(curl --fail --silent -H "Host: $$MI_HEALTH_HOST" -H "X-Forwarded-Proto: https" --output /dev/null --write-out "%{http_code}" http://127.0.0.1:3000/up)" = 200']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  worker:
    <<: *app
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    env_file: ./.mi-install/db.env
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql
      - ./installation/init-db.sh:/docker-entrypoint-initdb.d/10-mi-app.sh:ro
    networks: [appnet]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d mi_platform']
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  redis:
    image: redis:8.0.5-bookworm@sha256:dbd4be0dd40f16bd91486087680fc2d25666e807b937774906dc111a621ce556
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    volumes: [redis:/data]
    networks: [appnet]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  postgres:
  redis:
  storage:
networks:
  appnet:
